name: smart_dryer_app
description: Smart Drying and Hygiene System mobile application.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  http: ^1.2.2
  flutter_blue_plus: ^1.32.12
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/brand/dryguard_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/dryguard_icon.png
  adaptive_icon_background: "#043746"
  adaptive_icon_foreground: assets/brand/dryguard_icon.png
  remove_alpha_ios: true
